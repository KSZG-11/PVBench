# Benchmark 全局配置 v2

global:
  output_dir: "./results"
  device: "cuda"
  seed: 42
  hf_cache_dir: "./hf_cache"

models:
  # ── VLM ──
  # 使用 Qwen3.8-27B 8bit 量化 (LLM.int8, 精度接近 fp16, 显存 ~18GB)。
  #
  # 背景: Qwen3.8-27B BF16 ~54.7GB 与其余常驻模型共存会 OOM(总计>95GB);
  #       FP8 依赖 finegrained-fp8 kernel(需 triton 2.x, GPU 节点 triton 3.3.1 不兼容);
  #       故用 bitsandbytes 8bit 量化(transformers 原生, 无 kernel 下载依赖)。
  #
  # 切换回 Qwen3.5-9B (更省显存 ~18GB, 但能力弱):
  #   把 model_name 改为 .../Qwen--Qwen3.5-9B/snapshots/master, load_in_8bit: false
  vlm:
    default:
      model_name: "./hf_cache/models/Qwen--Qwen3.8-27B"
      device: "cuda"
      load_in_4bit: false           # 4-bit 量化 (精度低于 8bit)
      load_in_8bit: true            # 8-bit 量化 (LLM.int8, 依赖 bitsandbytes)
      max_new_tokens: 512
    logic:
      max_new_tokens: 512
    physics:
      max_new_tokens: 1024

  # ── 专用模型 ──
  quality:
    dino:
      model_id: "facebook/dinov3-vitb16-pretrain-lvd1689m"  # DINOv3 (2025.08, 唯一使用, 加载失败报错)
      device: "cuda"
    finevq:
      model_path: "IntMeGroup/FineVQ_score"  # FineVQ 视频美学评分 (FQ-2); null=自动解析本地 snapshot
      num_segments: 8                         # 稀疏帧采样数 (运动特征自动用密集帧)
      device: "cuda"
  physics:
    vggt:
      model_version: "omega"    # 仅 "omega" = VGGT-Omega (CVPR 2026 Oral); 加载失败直接报错
      model_path: null          # Omega: 本地 .pt 路径(null=自动搜索)
      image_resolution: 512     # Omega 输入分辨率 (512 无文本对齐 / 256 有文本对齐)
      device: "cuda"
    spatial_tracker:
      model_path: null
      device: "cuda"
    sam3:
      model_type: "vit_h"
      checkpoint_path: null        # null = facebook/sam3 (需HF权限申请通过)
      device: "cuda"
      confidence_threshold: 0.1    # SAM3 presence_score 过滤阈值 (正版 0.5, 木质/纹理物体需降低)
    stable_normal:
      model_path: null          # null = torch.hub Stable-X/StableNormal (公开)
      use_turbo: false          # true = StableNormal_turbo (快10x)
      device: "cuda"
    da3:
      model_path: null
      device: "cuda"
    reasonx:
      model_path: null          # null = adirik/InternVL2_5-4B-Intrinsic-Judge (完整权重)
      use_judge: true           # true=用InternVL裁判; 加载失败直接报错(不再降级经典光度学)
      device: "cuda"
    any6d:
      model_path: null
      mesh_path: null       # 可选: 默认物体mesh；正式调用也可通过pipeline传入any6d_mesh
      device: "cuda"
    flowseek:
      model_path: null
      device: "cuda"
    vfimamba:
      model_path: null
      device: "cuda"
    # genesis:                   # 废弃: AC-1 已改为反事实动作对，不再需要 Genesis 仿真引擎
    #   device: "cuda"

# ── 全局 Benchmark (L1+L2) 配置 ──
global_benchmark:
  prompt_sets:
    instruction_following: "prompts/instruction_following.yaml"
    commonsense: "prompts/commonsense.yaml"
    action_causal: "prompts/action_causal.yaml"

  logic:
    enabled: true
    modules:
      instruction_following: true    # IF-1~9 (合并原SA语义对齐维度)
      action_causal: true            # AC-1
      commonsense: true              # CS-1~3

  quality:
    enabled: true
    modules:
      frame_quality: true            # FQ-1~2 (主体一致性+美学质量)
                                     #  注: 原IF-10b(物体身份保真)已合并入FQ-1
      temporal_quality: true         # TQ-1~5 (运动平滑度/闪烁/动态/背景/成像)
      reference_fidelity: true       # IF-10a/c/d底层子指标；报告层聚合为L1 IF-10

# ── 物理层 (L3) 配置 ──
physics:
  enabled: true
  # VLM(Qwen3.5-9B) 按层 offload 到 CPU 腾显存 (为 A100-40GB 设计的 OOM 规避)。
  # H20-95GB 显存充足, 关闭 offload 让 VLM 常驻 GPU, 避免每视频往返搬移 ~18GB 权重。
  # true  = 每个非 VLM 模块运行前把 VLM 挪到 CPU (省显存, 但每视频多次过 PCIe, 慢)
  # false = VLM 常驻 GPU (H20 推荐, 显著提速)
  # ⚠️ 注：VLM 高频使用，保持常驻（false）。Any6D(R10) 的 InstantMesh 临时加载
  #    Zero123++ 时，由 pipeline_physics.py 在测 R10 前 offload 其他大模型腾空间，
  #    不通过本开关。
  vlm_offload: false
  modules:
    geometry:              # R01+R01+R03 (VGGT-Omega + StableNormal)
      enabled: true
    scale_pose:            # R04+R05+R06 (DA3+SAM3+Any6D+VGGT-Omega)
      enabled: true
    deformation_spatial:   # R02+R07 (VGGT-Omega+SpatialTracker+SAM3)
      enabled: true
    statics_lighting:      # R08+R13+R18 (VGGT-Omega+SAM3+ReasonX+StableNormal)
      enabled: true
    material:              # R03 (Qwen3-VL)
      enabled: true
    thermal:               # R07 (Qwen3-VL)
      enabled: true
    electromag:            # R09 (Qwen3-VL)
      enabled: true
    phase_change:          # R25 (Qwen3-VL)
      enabled: true
    kinematics:            # R10+R11+R17 (SpatialTracker+Any6D)
      enabled: true
    motion_persistence:    # R12+R13+R14 (VGGT-Omega+FlowSeek+VFIMamba+SpatialTracker+SAM3)
      enabled: true
    dynamics:              # R15+R23+R16 (SpatialTracker)
      enabled: true
    multiview:             # R08 多视图几何一致性 (VGGT-Omega)
      enabled: true        # T2V 用时间分镜/环绕镜头 proxy (temporal_multiview_proxy / continuous_view_sequence_proxy)

# ── 采样配置 ──
sampling:
  max_frames: 32           # 单视频最大采样帧数
  uniform: true            # 均匀采样
  event_detection: false   # 事件检测采样(实验性)
  # 使用全帧(不加采样)的模块列表。全帧会加载视频全部帧，显存和时间开销更大，
  # 但对需要完整时序覆盖的维度（物体计数/恒存/光影时序/运动连续性）至关重要。
  # 设为空列表 [] 则全部模块使用采样帧；设为 null 则按默认规则自动决定。
  full_frame_modules:
    - kinematics          # R10: 物体计数检测避免漏掉瞬态变化
    - dynamics            # R23: 碰撞发生在一瞬间, 32帧采样会错过碰撞拐点; 全帧精确定位碰撞
    # motion_persistence  # 临时注释: 快速验证 skipped 根因, 用 32 帧采样替代 241 帧全帧 (提速~7x)
    #                     # R14: 物体恒存需要全帧捕获出现/消失; R13: 运动连续性完整轨迹
    # statics_lighting 已移除: R13/R18 光影一致性用 32 帧采样即可判断光源是否稳定,
    # 全帧(240帧)逐帧跑 StableNormal+InternVL Judge 是最大性能开销(约7.5倍)。
  # 全帧加载最大帧数上限(防止超长视频OOM)。0=不限。
  full_frame_max: 300

