# Benchmark 全局配置 v2

global:
  output_dir: "./results"
  device: "cuda"
  seed: 42
  hf_cache_dir: "./hf_cache"

models:
  # ── VLM ──
  # 使用 Qwen3.8-27B 8bit 量化 (LLM.int8, 精度接近 fp16, 显存 ~18GB)。
  #
  # 8-bit quantization reduces memory usage; it requires bitsandbytes on NVIDIA GPUs.
  # If bitsandbytes is unavailable, the loader falls back to BF16 and needs more memory.
  #
  # 若显存不足，可切换到更小的兼容 VLM，并同步调整量化设置:
  #   把 model_name 改为本地兼容 VLM 路径，并将 load_in_8bit 设为 false
  vlm:
    default:
      model_name: "./hf_cache/models/Qwen--Qwen3.8-27B"
      device: "cuda"
      load_in_4bit: false           # 4-bit 量化 (精度低于 8bit)
      load_in_8bit: true            # 8-bit 量化 (LLM.int8, 依赖 bitsandbytes)
      max_new_tokens: 512
    logic:
      max_new_tokens: 512
    physics:
      max_new_tokens: 1024

  # ── 专用模型 ──
  quality:
    dino:
      model_id: "facebook/dinov3-vitb16-pretrain-lvd1689m"  # DINOv3 (2025.08, 唯一使用, 加载失败报错)
      device: "cuda"
    finevq:
      model_path: "IntMeGroup/FineVQ_score"  # FineVQ 视频美学评分 (FQ-2); null=自动解析本地 snapshot
      num_segments: 8                         # 稀疏帧采样数 (运动特征自动用密集帧)
      device: "cuda"
  physics:
    vggt:
      model_version: "omega"    # 仅 "omega" = VGGT-Omega (CVPR 2026 Oral); 加载失败直接报错
      model_path: null          # Omega: 本地 .pt 路径(null=自动搜索)
      image_resolution: 512     # Omega 输入分辨率 (512 无文本对齐 / 256 有文本对齐)
      device: "cuda"
    spatial_tracker:
      model_path: null
      device: "cuda"
    sam3:
      model_type: "vit_h"
      checkpoint_path: null        # null = facebook/sam3 (需HF权限申请通过)
      device: "cuda"
      confidence_threshold: 0.1    # SAM3 presence_score 过滤阈值 (正版 0.5, 木质/纹理物体需降低)
    stable_normal:
      model_path: null          # null = torch.hub Stable-X/StableNormal (公开)
      use_turbo: false          # true = StableNormal_turbo (快10x)
      device: "cuda"
    da3:
      model_path: null
      device: "cuda"
    reasonx:
      model_path: null          # null = adirik/InternVL2_5-4B-Intrinsic-Judge (完整权重)
      use_judge: true           # true=用InternVL裁判; 加载失败直接报错(不再降级经典光度学)
      device: "cuda"
    any6d:
      model_path: null
      mesh_path: null       # 可选: 默认物体mesh；正式调用也可通过pipeline传入any6d_mesh
      device: "cuda"
    flowseek:
      model_path: null
      device: "cuda"
    vfimamba:
      model_path: null
      device: "cuda"

# ── 全局 Benchmark (L1+L2) 配置 ──
global_benchmark:
  # Prompt resources are intentionally maintained outside this repository.
  # Add local paths here when running the global benchmark.
  # prompt_sets:
  #   instruction_following: "/path/to/instruction_following.yaml"
  #   commonsense: "/path/to/commonsense.yaml"
  #   action_causal: "/path/to/action_causal.yaml"

  logic:
    enabled: true
    modules:
      instruction_following: true    # IF-1~9 (合并原SA语义对齐维度)
      action_causal: true            # AC-1
      commonsense: true              # CS-1~3

  quality:
    enabled: true
    modules:
      frame_quality: true            # FQ-1~2 (主体一致性+美学质量)
                                     #  注: 原IF-10b(物体身份保真)已合并入FQ-1
      temporal_quality: true         # TQ-1~5 (运动平滑度/闪烁/动态/背景/成像)
      reference_fidelity: true       # IF-10a/c/d底层子指标；报告层聚合为L1 IF-10

# ── 物理层 (L3) 配置 ──
physics:
  enabled: true
  # Move the VLM to CPU before non-VLM modules to reduce peak memory usage.
  # true  = lower peak memory, but slower because weights move between CPU and GPU.
  # false = keep the VLM on GPU for faster evaluation when memory allows.
  # Any6D may still trigger temporary offloading of other large models.
  vlm_offload: false
  modules:
    geometry:              # R01+R02+R03 (VGGT-Omega + StableNormal)
      enabled: true
    scale_pose:            # R04+R09+R10 (DA3+SAM3+Any6D+VGGT-Omega)
      enabled: true
    deformation_spatial:   # R05+R11 (VGGT-Omega+SpatialTracker+SAM3)
      enabled: true
    statics_lighting:      # R12+R13+R18 (VGGT-Omega+SAM3+ReasonX+StableNormal)
      enabled: true
    material:              # R06 (Qwen3.8-27B)
      enabled: true
    thermal:               # R07 (Qwen3.8-27B)
      enabled: true
    electromag:            # R14 (Qwen3.8-27B)
      enabled: true
    phase_change:          # R25 (Qwen3.8-27B)
      enabled: true
    kinematics:            # R15+R16+R17 (SpatialTracker+Any6D)
      enabled: true
    motion_persistence:    # R19+R20+R21 (VGGT-Omega+FlowSeek+VFIMamba+SpatialTracker+SAM3)
      enabled: true
    dynamics:              # R22+R23+R24 (SpatialTracker)
      enabled: true
    multiview:             # R08 多视图几何一致性 (VGGT-Omega)
      enabled: true        # T2V 用时间分镜/环绕镜头 proxy (temporal_multiview_proxy / continuous_view_sequence_proxy)

# ── 采样配置 ──
sampling:
  max_frames: 32           # 单视频最大采样帧数
  uniform: true            # 均匀采样
  event_detection: false   # 事件检测采样(实验性)
  # 使用全帧(不加采样)的模块列表。全帧会加载视频全部帧，显存和时间开销更大，
  # 但对需要完整时序覆盖的维度（物体计数/恒存/光影时序/运动连续性）至关重要。
  # 设为空列表 [] 则全部模块使用采样帧；设为 null 则按默认规则自动决定。
  full_frame_modules:
    - kinematics          # R15: 物体计数检测避免漏掉瞬态变化
    - dynamics            # R23: 碰撞发生在一瞬间, 32帧采样会错过碰撞拐点; 全帧精确定位碰撞
    # motion_persistence  # Enable for complete temporal coverage; disabled by default for speed.
    #                     # R21: 物体恒存需要全帧捕获出现/消失; R20: 运动连续性完整轨迹
    # statics_lighting is omitted by default; 32 sampled frames are usually sufficient.
  # 全帧加载最大帧数上限(防止超长视频OOM)。0=不限。
  full_frame_max: 300
