# 动作因果效应 标准化 Prompt 测试集
# 评测方式: 反事实动作对 (Counterfactual Action Pairs)
# - 每条 case 含 action_prompt(施加动作) 和 control_prompt(同一场景无动作)
# - 对同一模型分别生成两段视频，SpatialTracker 追踪轨迹后对比因果效应
# - 单视频降级模式：仅用 action_prompt 生成视频，以首帧为静态基线近似评测

prompts:
  - id: AC-001
    text: "push a glass cup off the edge of a table"
    control_prompt: "a glass cup sitting still on the edge of a table, nothing touching it"
    action_type: push
    expected_outcome: "glass falls off the table, hits ground, shatters into pieces"
    objects: ["glass_cup", "table", "ground"]
    materials: ["glass"]

  - id: AC-002
    text: "kick a soccer ball on a grass field"
    control_prompt: "a soccer ball sitting still on a grass field, no one nearby"
    action_type: kick
    expected_outcome: "ball rolls forward on grass, gradually decelerates due to friction"
    objects: ["soccer_ball", "grass_field"]
    materials: ["rubber"]

  - id: AC-003
    text: "drop a rubber ball from 2 meters high onto a hard floor"
    control_prompt: "a rubber ball sitting still on a hard floor"
    action_type: drop
    expected_outcome: "ball bounces multiple times, each bounce lower, eventually settles"
    objects: ["rubber_ball", "hard_floor"]
    materials: ["rubber"]

  - id: AC-004
    text: "pour water from a bottle into a glass"
    control_prompt: "a water bottle and an empty glass sitting still on a table"
    action_type: pour
    expected_outcome: "water flows from bottle to glass in a continuous stream, fills glass"
    objects: ["water_bottle", "glass", "water"]
    materials: ["water", "glass"]

  - id: AC-005
    text: "strike a match against a matchbox"
    control_prompt: "an unlit match and a matchbox sitting still on a table"
    action_type: strike
    expected_outcome: "match head ignites, flame appears and burns downward along the match"
    objects: ["match", "matchbox", "flame"]
    materials: ["wood"]

  - id: AC-006
    text: "cut through a piece of paper with scissors"
    control_prompt: "a piece of paper and scissors lying still on a desk"
    action_type: cut
    expected_outcome: "scissors create a clean cut, paper separates along the cut line"
    objects: ["scissors", "paper"]
    materials: ["paper"]

  - id: AC-007
    text: "throw a stone into a calm pond"
    control_prompt: "a calm pond surface, no disturbances"
    action_type: throw
    expected_outcome: "stone splashes into water, circular ripples expand outward from impact point"
    objects: ["stone", "pond_water"]
    materials: ["stone", "water"]

  - id: AC-008
    text: "roll a bowling ball down a lane to hit pins"
    action_type: roll
    control_prompt: "bowling pins standing still at the end of a lane, ball not yet released"
    expected_outcome: "ball rolls straight, hits pins, pins scatter in realistic collision patterns"
    objects: ["bowling_ball", "pins", "lane"]
    materials: ["hard_plastic"]

  - id: AC-009
    text: "blow out a candle"
    control_prompt: "a lit candle burning steadily, no wind"
    action_type: blow
    expected_outcome: "flame flickers and extinguishes, thin smoke trail rises upward"
    objects: ["candle", "flame", "smoke"]
    materials: ["wax"]

  - id: AC-010
    text: "crumple a piece of aluminum foil"
    control_prompt: "a flat piece of aluminum foil lying still on a table"
    action_type: crumple
    expected_outcome: "foil deforms plastically into a compact wrinkled ball, stays crumpled"
    objects: ["aluminum_foil"]
    materials: ["metal"]
